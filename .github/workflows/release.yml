name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      text:
        description: "What changed?"
        required: false

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build Chrome and Firefox zips
        # creates .output/chess-com-insights-<version>-{chrome,firefox,sources}.zip
        run: |
          pnpm zip
          pnpm zip:firefox

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            Chess Stats Release v${{ steps.version.outputs.version }}

            - `chess-com-insights-${{ steps.version.outputs.version }}-chrome.zip`: Chrome, Edge, Brave, Opera
            - `chess-com-insights-${{ steps.version.outputs.version }}-firefox.zip`: Firefox
            - `chess-com-insights-${{ steps.version.outputs.version }}-sources.zip`: source code for the Firefox Add-ons review

            ${{ github.event.inputs.text }}
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
            .output/*-sources.zip
